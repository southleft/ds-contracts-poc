<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Generic families resolve to the free, metric-compatible equivalents of the macOS and Windows
     defaults: sans-serif and system-ui to Arimo (Arial, Helvetica), serif to Tinos (Times),
     monospace to Cousine (Courier). Read before 25-wqy-zenhei.conf, which would otherwise put a
     CJK face first. Only generic families; every other face stays installed for fallback. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Arimo</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Arimo</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Tinos</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Cousine</family></prefer></alias>
</fontconfig>
