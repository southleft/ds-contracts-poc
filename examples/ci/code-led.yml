# CODE-LED journey — code is truth; CI keeps the contracts current.
#
# READ THIS BEFORE COPYING THE FILE — what static extraction can and cannot do
# ============================================================================
# This recipe runs STATIC extraction (`ds-contracts extract`): it reads your
# component SOURCE. It recovers the API surface (props, enums, defaults,
# events) for any library the adapters understand, and it recovers ANATOMY —
# the parts, the token bindings, the thing a component actually looks like —
# only for React + a co-located CSS Module.
#
# For every other library (CSS-in-JS, StyleX, Tailwind classes, web
# components, a design system whose styles live anywhere else) static
# extraction emits a STUB anatomy: `"anatomy": { "root": {} }`.
#
# A stub does NOT refuse. It generates. Sent to the Figma plugin, a stub
# produces a component set with correctly-named variant frames and NOTHING
# INSIDE THEM — measured: one stub contract (10 variants) emits a 53,283-byte
# sync script whose every variant spec is a bare `{ type: root, name, layout }`
# with no children, no fills and no text. Blank boxes, correctly labelled.
#
# So this workflow is split by a GATE, on purpose:
#
#   ALWAYS  — extract → adopt → commit contracts/. Contracts in git are
#             worth having on their own: a diffable, reviewable API surface
#             for the whole library, on every push. Stub anatomy included.
#   GATED   — bundle + deliver to the designer's canvas. Runs ONLY when every
#             adopted contract carries real anatomy. If any is a stub the
#             canvas half is skipped and the job summary names each stub
#             component and the command that fixes it.
#
# The fix is the computed-capture path — a real Chromium renders your
# components and the anatomy is measured instead of guessed:
#
#     npx @ds-contracts/cli onboard <your-package-or-path>
#     # …review the drafted capture config it stops at, then:
#     npx @ds-contracts/cli onboard --continue
#
# `onboard` and `promote` shipped in 0.3.0 (0.2.0 had no `onboard` at all).
# The longhand equivalent — `extract --draft-capture-config` → review →
# `extract --computed --config` → `promote` — is what `onboard` runs for you.
# Either way: capture first, canvas second. This recipe will not publish blank
# components to a designer's file.
#
# ----------------------------------------------------------------------------
# On every push to main (and on each published release) this workflow:
#   1. runs the published @ds-contracts/cli@0.4.0 `extract` over the component
#      source (config: ds-contracts.config.json, committed in the repo),
#   2. adopts the freshly proposed contracts into contracts/ (code-led means
#      code wins — extraction output IS the new truth),
#   3. opens/updates a PR with the refreshed contracts/ (PR-first — docs/18
#      G10; no default direct-main write),
#   4. GATE — refuses the canvas half when any adopted contract is stub anatomy,
#   5. (gated) uploads a CONTRACTS-BUNDLE artifact — the exact envelope the
#      plugin bridge carries ({ "type": "CONTRACTS-BUNDLE", "version": 1,
#      "contracts": [...] }, workers/assist/src/bridge.ts) — so a designer can
#      deliver it with
#      `npx @ds-contracts/cli figma push contracts-bundle.json --code <CODE>`,
#   6. (gated) PUBLISHES the bundle to the standing CI→Figma channel, so the
#      designer's plugin finds it waiting with no human courier,
#   7. writes proposal/skip counts AND the anatomy verdict into the job
#      summary — whichever way the gate went.
#
# The channel step is the fully-async half. It needs one repository secret,
# minted once:
#
#     npx @ds-contracts/cli figma claim-channel
#     → WRITE key (dscw_…)  → repo secret DS_CONTRACTS_CHANNEL_KEY (this file)
#     → READ  key (dscr_…)  → the designer pastes it into the Figma plugin
#
# The read key is sha256(write key): the designer's half can only READ, so a
# shared Figma file or a screenshotted plugin window can never inject into
# this repository's source of truth. See workers/assist/src/channel.ts.
#
# The pairing-code path (`ds-contracts figma push … --code <CODE>`) is NOT
# removed — it stays as the ad-hoc route for a repo with no channel yet, or a
# one-off bundle from a laptop. It is the "unverified" path: nothing about
# who published travels with it.
#
# STILL OPEN, named rather than implied: the delivery is not SIGNED. The
# provenance below is attached by this workflow and echoed unread by the
# worker; anyone holding the write key can publish any provenance they like.
# HMAC-verified deliveries with a "verified" badge in the plugin are docs/18
# G1's slice S3 and are excluded from this round BY NAME.
#
# Validated locally step-by-step against the published CLI:
# examples/ci/VALIDATION.md (produced by examples/ci/validate.mjs). That
# receipt's own consumer fixture is a React library with NO co-located CSS —
# so the anatomy gate FIRES there, and the receipt shows the canvas half
# skipped. That is the recipe working, demonstrated on the exact case this
# header warns about.

name: contracts-code-led

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  extract-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract contracts from code
        run: |
          # Keep the copyable path on the published stable CLI. The
          # `--canonical` guard is a 0.5.0-rc.1 source/next-release feature,
          # not a flag shipped by 0.4.0; do not advertise or pin an
          # unpublished registry version here.
          npx --yes @ds-contracts/cli@0.4.0 extract ds-contracts.config.json | tee extract.log

      - name: Adopt the proposed contracts (code-led — extraction is the new truth)
        run: |
          # ds-contracts extract writes proposals to <out>/contracts/
          # (out = "ds-contracts/out" in the default config).
          mkdir -p contracts
          cp ds-contracts/out/contracts/*.contract.json contracts/

      - name: "GATE: is this library's anatomy real, or a stub?"
        id: anatomy
        # The whole point of this workflow's split. Static extraction recovers
        # anatomy ONLY from React + a co-located CSS Module; for anything else
        # it emits `"anatomy": { "root": {} }` — a contract that generates a
        # canvas set of correctly-named, EMPTY variant frames. Nothing
        # downstream refuses it, so the refusal has to live here.
        #
        # Stub test, read off the contract itself (not off the adapter name).
        # Predicate MUST match packages/cli `anatomyNodeHasDrawableSubstance` /
        # `isDrawableEmptyContract`: hollow `parts: { label: {} }` and empty
        # `content: {}` are NOT drawable — they still paint blank frames.
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync, readdirSync, writeFileSync } from "node:fs";
          const hasDrawableSubstance = (node) => {
            if (!node || typeof node !== "object" || Array.isArray(node)) return false;
            const tokens = node.tokens;
            if (
              tokens &&
              typeof tokens === "object" &&
              !Array.isArray(tokens) &&
              Object.keys(tokens).length > 0
            ) {
              return true;
            }
            if (node.component !== undefined && node.component !== null) return true;
            const content = node.content;
            if (content !== undefined && content !== null) {
              if (typeof content === "object" && !Array.isArray(content)) {
                if (Object.keys(content).length > 0) return true;
              } else if (content !== "") {
                return true;
              }
            }
            const parts = node.parts;
            if (parts && typeof parts === "object" && !Array.isArray(parts)) {
              for (const child of Object.values(parts)) {
                if (hasDrawableSubstance(child)) return true;
              }
            }
            return false;
          };
          const files = readdirSync("contracts").filter((f) => f.endsWith(".contract.json")).sort();
          if (files.length === 0) throw new Error("no contracts to check");
          const stubs = [];
          for (const f of files) {
            const c = JSON.parse(readFileSync(`contracts/${f}`, "utf8"));
            const anatomy = c?.anatomy;
            const roots = anatomy && typeof anatomy === "object" ? Object.keys(anatomy) : [];
            const root = anatomy?.root ?? (roots[0] ? anatomy[roots[0]] : undefined);
            if (!hasDrawableSubstance(root)) stubs.push(`${c.id} (${c.name}) — ${f}`);
          }
          const ready = stubs.length === 0;
          console.log(
            ready
              ? `anatomy OK: ${files.length}/${files.length} contract(s) carry real anatomy — canvas delivery proceeds`
              : `STUB ANATOMY: ${stubs.length}/${files.length} contract(s) have empty/hollow anatomy. Canvas delivery is SKIPPED — sending these would create correctly-named, VISUALLY EMPTY component sets in the designer's file.`,
          );
          for (const s of stubs) console.log(`  - ${s}`);
          writeFileSync("anatomy-stubs.txt", stubs.join("\n") + (stubs.length ? "\n" : ""));
          const out = [
            `canvas_ready=${ready}`,
            `total=${files.length}`,
            `stub_count=${stubs.length}`,
          ].join("\n") + "\n";
          if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, out);
          EOF

      - name: Build the CONTRACTS-BUNDLE artifact (the plugin-bridge envelope)
        # Gated by the substance anatomy check above — hollow parts/content
        # never reach this step. The envelope is assembled here (not via a
        # pinned older CLI) so the recipe stays runnable on @ds-contracts/cli
        # 0.3.0 publish while the canvas_ready predicate tracks current
        # `isDrawableEmptyContract` semantics.
        if: ${{ steps.anatomy.outputs.canvas_ready == 'true' }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          const files = readdirSync("contracts").filter((f) => f.endsWith(".contract.json")).sort();
          if (files.length === 0) throw new Error("no contracts to bundle");
          const contracts = files.map((f) => JSON.parse(readFileSync(`contracts/${f}`, "utf8")));
          const bundle = { type: "CONTRACTS-BUNDLE", version: 1, contracts };
          writeFileSync("contracts-bundle.json", JSON.stringify(bundle, null, 2) + "\n");
          console.log(`contracts-bundle.json: ${contracts.length} contract(s)`);
          EOF

      - name: Open or update a PR for refreshed contracts (PR-first — G10)
        # NOT gated: contracts in git are the deliverable of the always-half.
        # A stub-anatomy contract is still a real, reviewable API surface —
        # it just must not reach a canvas.
        #
        # Wave 3 / docs/18 G10: default is PR-first, not a direct push to
        # main. Direct-main writes are refused by this recipe; reviewers see
        # the contract diff before merge. No-op when extraction changed
        # nothing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contracts
          if git diff --cached --quiet; then
            echo "contracts/ unchanged — nothing to propose"
            exit 0
          fi
          BRANCH="contracts/code-led-${GITHUB_SHA::7}"
          git checkout -B "$BRANCH"
          git commit -m "contracts: refresh from code (ds-contracts extract, ${GITHUB_SHA::7})"
          git push -u origin "$BRANCH" --force-with-lease
          if gh pr list --head "$BRANCH" --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --title "contracts: refresh from code (${GITHUB_SHA::7})" \
              --body "$(cat <<'EOF'
          ## Summary
          Code-led extraction refreshed \`contracts/\` (docs/18 G10 PR-first default).

          ## Notes
          - Direct commits to main are not used by this recipe.
          - Canvas delivery remains gated by the anatomy substance check.
          EOF
          )"
          else
            echo "PR already open for $BRANCH"
          fi

      - name: Upload the CONTRACTS-BUNDLE artifact
        if: ${{ steps.anatomy.outputs.canvas_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: CONTRACTS-BUNDLE
          path: contracts-bundle.json

      - name: Publish to the standing CI→Figma channel
        # The zero-chore delivery. No pairing code, no human courier, no
        # synchronous window: the designer's plugin finds this waiting on its
        # next "Check for updates" and reviews it before anything applies.
        #
        # Provenance (repo / run / commit / ref) is auto-detected from the
        # GITHUB_* context and rides as a SIBLING of the bundle — never inside
        # it, so `ds-contracts figma bundle` keeps its byte-determinism.
        #
        # Skipped, not failed, when the secret is absent: a fork PR and a repo
        # that has not minted a channel both still get their artifact. Skipped
        # too when the anatomy gate said no.
        #
        # VERSION: `figma publish` and `figma claim-channel` are IN the pinned
        # 0.3.0. An earlier revision of this file claimed they were unreleased
        # and that the pin resolved to a nonexistent version — that was wrong,
        # and it is corrected here.
        #
        # `onboard` and `promote` shipped in 0.3.0 as well — 0.2.0's tarball
        # contained ZERO files matching `onboard`, which is the defect the pin
        # bump closes. This recipe still does not call them: `onboard` runs a
        # real browser capture, which is a per-library setup act with a human
        # review gate in the middle, not something a push-triggered workflow
        # should do unattended. See docs/21 for that path.
        if: ${{ steps.anatomy.outputs.canvas_ready == 'true' && env.DS_CONTRACTS_CHANNEL_KEY != '' }}
        env:
          DS_CONTRACTS_CHANNEL_KEY: ${{ secrets.DS_CONTRACTS_CHANNEL_KEY }}
        run: |
          npx --yes @ds-contracts/cli@0.3.0 figma publish contracts-bundle.json | tee publish.log

      - name: Job summary — proposal / skip counts + the anatomy verdict
        if: ${{ always() }}
        # Gate results arrive as env, not as `${{ }}` interpolated into the
        # shell body: an expression spliced into a script is an injection seam,
        # and env keeps this step runnable verbatim outside Actions (which is
        # how examples/ci/validate.mjs executes it).
        env:
          CANVAS_READY: ${{ steps.anatomy.outputs.canvas_ready }}
          ANATOMY_TOTAL: ${{ steps.anatomy.outputs.total }}
          ANATOMY_STUBS: ${{ steps.anatomy.outputs.stub_count }}
        run: |
          {
            echo "## ds-contracts extract"
            echo ""
            grep -E "proposed contract" extract.log | sed 's/^/- /'
            grep -E "seen but not extractable" extract.log | sed 's/^/- /' || echo "- 0 components skipped"
            echo ""
            echo "### Anatomy gate"
            echo ""
            if [ "${CANVAS_READY}" = "true" ]; then
              echo "✅ **${ANATOMY_TOTAL}/${ANATOMY_TOTAL} contracts carry real anatomy.** Canvas delivery ran."
            else
              echo "⛔ **Canvas delivery SKIPPED — ${ANATOMY_STUBS} of ${ANATOMY_TOTAL} contracts have STUB anatomy** (\`\"anatomy\": { \"root\": {} }\`)."
              echo ""
              echo "Static extraction recovers anatomy only from **React + a co-located CSS Module**."
              echo "For every other styling system it proposes an empty root — and an empty root does"
              echo "not refuse downstream, it **generates correctly-named, visually EMPTY component"
              echo "sets** in the designer's Figma file. That is why this job stopped here."
              echo ""
              echo "Stub contracts:"
              echo ""
              sed 's/^/- /' anatomy-stubs.txt
              echo ""
              echo "**The fix — measure the anatomy instead of guessing it** (real Chromium, computed styles):"
              echo ""
              echo '```'
              echo 'npx @ds-contracts/cli onboard <your-package-or-path>   # stops at a review gate'
              echo 'npx @ds-contracts/cli onboard --continue               # capture → promote → publish'
              echo '```'
              echo ""
              echo "(\`onboard\` needs @ds-contracts/cli >= 0.3.0. The longhand it wraps:"
              echo "\`extract --draft-capture-config\` → review → \`extract --computed --config\` → \`promote\`,"
              echo "then re-run this workflow.)"
              echo ""
              echo "The contracts themselves **were** committed — a stub contract is still a real,"
              echo "reviewable API surface. Only the canvas half is withheld."
            fi
            echo ""
            if [ -f publish.log ]; then
              echo "### Delivered to the standing channel"
              echo ""
              sed 's/^/- /' publish.log
              echo ""
              echo "The designer's plugin picks this up on its next **Check for updates**."
            elif [ "${CANVAS_READY}" = "true" ]; then
              echo "No channel configured (secret \`DS_CONTRACTS_CHANNEL_KEY\` is unset)."
              echo "Mint one with \`npx @ds-contracts/cli figma claim-channel\`, or hand the"
              echo "artifact over the ad-hoc pairing-code route:"
              echo '`npx @ds-contracts/cli figma push contracts-bundle.json --code <CODE>`'
              echo "(the code comes from the Figma plugin's Receive panel)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
