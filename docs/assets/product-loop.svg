<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">React and Figma, connected through contracts</title>
  <desc id="desc">Intended workflows, still in development. React library to shared contract to editable Figma component sets. Figma library to shared contract to reusable React library. Changes on either side are compared against the shared baseline, repaired under an ownership policy, then independently verified. Scope includes data tables, nested components, slots, instance swaps, variants and tokens.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#3b6559" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1080" height="600" rx="12" fill="#f5f6f2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1f3430">
    <text x="36" y="44" font-size="25" font-weight="700">React and Figma, connected through contracts</text>
    <text x="36" y="73" font-size="16" fill="#52645e">V1 focus · deterministic conversion · complete journeys still in development</text>
    <g font-size="14" font-weight="700" letter-spacing="1.3" fill="#52645e">
      <text x="36" y="113">START WITH YOUR LIBRARY</text>
      <text x="405" y="113">DESCRIBE WHAT IT MEANS</text>
      <text x="775" y="113">GENERATE THE OTHER SURFACE</text>
    </g>
    <g fill="#ffffff" stroke="#ccd5cc">
      <rect x="36" y="131" width="270" height="98" rx="7"/>
      <rect x="405" y="131" width="270" height="98" rx="7" fill="#e5eee6"/>
      <rect x="775" y="131" width="270" height="98" rx="7"/>
      <rect x="36" y="251" width="270" height="98" rx="7"/>
      <rect x="405" y="251" width="270" height="98" rx="7" fill="#e5eee6"/>
      <rect x="775" y="251" width="270" height="98" rx="7"/>
    </g>
    <g font-size="21" font-weight="700">
      <text x="55" y="164">React library</text>
      <text x="424" y="164">Shared contract</text>
      <text x="794" y="164">Editable Figma</text>
      <text x="55" y="284">Figma library</text>
      <text x="424" y="284">Shared contract</text>
      <text x="794" y="284">Reusable React</text>
    </g>
    <g font-size="16" fill="#52645e">
      <text x="55" y="191">Components, APIs and states</text>
      <text x="55" y="213">Original styling and behavior</text>
      <text x="424" y="191">Structure, properties, tokens</text>
      <text x="424" y="213">Composition and named limits</text>
      <text x="794" y="191">Native component sets</text>
      <text x="794" y="213">Properties, slots and variables</text>
      <text x="55" y="311">Component sets and instances</text>
      <text x="55" y="333">Properties, content and tokens</text>
      <text x="424" y="311">Structure, properties, tokens</text>
      <text x="424" y="333">Composition and named limits</text>
      <text x="794" y="311">Installable component library</text>
      <text x="794" y="333">Content APIs and variants</text>
    </g>
    <g fill="none" stroke="#3b6559" stroke-width="2" marker-end="url(#arrow)">
      <path d="M317 180H392"/><path d="M687 180H762"/>
      <path d="M317 300H392"/><path d="M687 300H762"/>
    </g>
    <path d="M36 375H1045" stroke="#ccd5cc"/>
    <text x="36" y="409" font-size="19" font-weight="700">When both libraries exist</text>
    <g font-size="17">
      <text x="36" y="446">Change either side</text>
      <text x="307" y="446">Compare with baseline</text>
      <text x="600" y="446">Authorize repairs</text>
      <text x="875" y="446">Apply and verify</text>
    </g>
    <g fill="none" stroke="#3b6559" stroke-width="2" marker-end="url(#arrow)">
      <path d="M215 440H284"/><path d="M506 440H577"/><path d="M758 440H849"/>
    </g>
    <rect x="36" y="478" width="1009" height="49" rx="6" fill="#e5eee6"/>
    <text x="55" y="509" font-size="17" font-weight="700">Every journey: verify actual output, report unsupported facts, repeat without unnecessary changes.</text>
    <text x="36" y="562" font-size="16" fill="#52645e">Scope: data tables · nested components · content slots · instance swaps · variants · token bindings</text>
  </g>
</svg>
