name: release candidate

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build RC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: clean checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install exact dependencies
        run: npm ci

      - name: install Chromium for browser-driven gates
        run: npx playwright-core install --with-deps chromium

      - name: validate release-candidate configuration
        run: node scripts/build-release-candidate.mjs --check

      - name: run gates and build release candidate
        run: node scripts/build-release-candidate.mjs

      - name: upload release-candidate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ runner.os }}-${{ github.sha }}
          path: |
            dist/release-candidate/*.tgz
            dist/release-candidate/manifest.json
            dist/release-candidate/SHA256SUMS
            dist/release-candidate/provenance.json
          if-no-files-found: warn
          retention-days: 14
