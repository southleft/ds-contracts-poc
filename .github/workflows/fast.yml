# FAST LANE — the signal a contributor gets in under a minute.
#
# WHY THIS FILE EXISTS. Until 2026-08-04 this repository had no .github/
# directory at all: 33 gate scripts, every one of them fired only when a human
# typed it. That is the same shape as the two incidents the gates themselves
# were written for — `deploy-check.mjs` (the live playground served a plugin
# build from mid-July for three weeks while every BUILD-time guard was green)
# and `publish-check.mjs` (a 332-line `onboard` rewrite landed under a version
# the registry already served). In both, the machinery was fresh and nothing
# COMPARED it to what the world could see. A pull request from an outside
# contributor was in exactly that position: zero automated verification.
#
# WHAT THIS LANE IS FOR. Everything here is cheap enough that a contributor can
# also run it locally before pushing — `npm run ci:lane fast` executes the
# guarded commands directly from this file (see docs/25-reading-a-red-ci.md).
# It prints, but deliberately does not run, prep commands such as npm ci and
# clean-checkout builds. Run the printed package builds first on a cold tree.
#
# In addition to the established contract gates, this lane closes package and
# application surfaces that were previously invisible: every tracked CLI and
# Worker test, measured CLI-source coverage, schema/emitter build + pack smoke,
# Worker/package/app typechecks, and scoped lint/format checks.
#
# WHY publish:check IS IN THE FAST LANE AND SAFE HERE. It reads the public npm
# registry and never writes: `npm view` + an HTTPS fetch of each published
# tarball, then a byte comparison of every locally packed file. Publishing
# needs the owner's OTP and stays a human act. Each package's "not published
# yet" branch is a PASS while the other package versions are still checked:
#
#     ✔ SOURCE AHEAD — @ds-contracts/cli@0.5.0-rc.1 is not published;
#       registry byte comparison skipped.
#     ✔ SOURCE AHEAD — @ds-contracts/schema@16.1.0-rc.1 is not published;
#       registry byte comparison skipped.
#     REFUSED: @ds-contracts/emitter-web-components@0.3.0 registry contents
#       differ (...). The unpublished RCs did not hide the published claim.
#
# THE PREREQUISITE THAT IS EASY TO MISS: every package's `dist/` is gitignored
# (.gitignore:3 `dist/`), so a fresh checkout has nothing honest to pack and
# compare. Hence the three guarded prep builds below; if one is removed,
# publish:check refuses that package by name instead of blessing partial bytes.
#
# HOW A FAILURE REPORTS. Each gate is its own step guarded by
# `if: !cancelled() && steps.setup.outcome == 'success'`, so ONE red gate never
# hides the others — every gate still runs and reports its own conclusion, and
# the job fails at the end. `continue-on-error` is deliberately NOT used: it
# would paint a failing gate green in the checks list.
name: fast

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  # Never cancel a main-branch run — main's result is the record of what the
  # default branch is worth. Feature branches supersede themselves freely.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast:
    name: fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: eval:record:check proves evals/results.json was
        # measured on an ANCESTOR of the commit under test (git merge-base
        # --is-ancestor). A depth-1 checkout of a PR merge commit has no
        # ancestors at all, so the stamped record read as foreign
        # (2026-08-22, run 32600919494). .git is ~280 MB; the cost is seconds.
        with:
          fetch-depth: 0

      # Node is pinned to the exact version the gates were verified on, not to
      # `20.x`: docs and packages/cli both declare `engines.node >= 20`, and
      # 20.19.4 is what produced every measurement in this file.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci

      # THE ONLY HARD STOP. Without the install nothing below can be attempted,
      # so `setup` sits directly after it: a failed `npm ci` skips `setup`, every
      # guarded step below evaluates false, and the job stops honestly.
      - name: install complete
        id: setup
        run: echo "Every step below runs even if an earlier one fails; the job fails at the end."

      # Root consumers import @ds-contracts/schema through its package exports,
      # which point at gitignored dist/. A clean checkout therefore must build
      # the workspace before any root typecheck/test can resolve it. The local
      # lane runner prints (but does not execute) this prep command.
      - name: build @ds-contracts/schema (resolution + publish:check prerequisite)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env: { CI_LANE_STEP: prep }
        run: npm --prefix packages/schema run build

      # publish:check packs all three BUILT packages and compares every file
      # against the registry; dist/ is gitignored, so each must be built here.
      # Guarded like gates so a broken build does not hide unrelated results.
      # CI_LANE_STEP: prep keeps `npm run ci:lane fast` from running it locally.
      - name: build @ds-contracts/cli (publish:check prerequisite)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env: { CI_LANE_STEP: prep }
        run: npm --prefix packages/cli run build

      - name: build @ds-contracts/emitter-web-components (publish:check prerequisite)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env: { CI_LANE_STEP: prep }
        run: npm --prefix packages/emitter-web-components run build

      # ---------------------------------------------------------------- gates
      - name: falsify lane setup cardinality
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx tsx .github/scripts/lane-coverage.ts --self-test

      # A GATE ON THE GATES. Refuses when a gate-shaped script in package.json
      # is in no lane and on no exclusion list, when a lane names a script that
      # does not exist, or when a gate step loses its independent-reporting
      # guard. Without it, the way this repo's CI defect returns is: gate #34
      # is written, never wired, and the checks list stays green.
      - name: ci:lanes (every gate script is wired into a lane or excluded by name)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run ci:lanes

      - name: typecheck (src, scripts, core, extract, parity, evals, conformance)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck

      - name: typecheck packages/cli
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/cli run typecheck

      # The root tsconfig's `include` does not name .github, so this directory's
      # TypeScript would otherwise be checked for the first time by CI itself.
      - name: typecheck .github/scripts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx tsc --noEmit -p .github/scripts/tsconfig.json

      - name: lint hand-maintained source
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lint

      - name: prettier check (hand-maintained source only)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run format:check

      - name: typecheck @ds-contracts/schema
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/schema run typecheck

      - name: package smoke @ds-contracts/schema
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/schema run package:smoke

      - name: typecheck @ds-contracts/emitter-web-components
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/emitter-web-components run typecheck

      - name: package smoke @ds-contracts/emitter-web-components
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/emitter-web-components run package:smoke

      - name: typecheck playground
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck:playground

      - name: typecheck dashboard
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck:dashboard

      - name: typecheck site
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck:site

      - name: test Worker
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix workers/assist run test

      - name: typecheck Worker
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix workers/assist run typecheck

      - name: test playground bridge capability
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:playground

      # Sits immediately before docs:check because docs:check GATES every "N/N
      # pass" claim in the documentation against evals/results.json — so if that
      # record is stale relative to the registry, docs:check is validating a
      # smaller denominator than the suite actually has. That happened for hours
      # on 2026-08-08 with a case that was registered, red, and unrecorded.
      # The capture-framing pin's red halves (C1 cell framing, C3b provenance,
      # C4 stage clip, C5 wrong-variant sweep, C6 tone swap) live in this
      # node:test file. An eval already spawns it, but nothing in CI NAMED it —
      # so ci:lanes counted it uncovered, which is the same orphaned-fixture
      # class this repo keeps finding. Named here so it is covered by intent.
      - name: test:console-loop-capture-framing (the reference-check red halves)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:console-loop-capture-framing

      - name: eval:registry:check (results.json covers every registered eval)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run eval:registry:check

      - name: docs:check (every number and link the docs quote, re-derived)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run docs:check
      - name: eval:record:check (evals/results.json was MEASURED on a clean ancestor commit, not asserted)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run eval:record:check
      - name: schema:fresh (both committed contract.schema.json copies match an in-memory emission of the Zod document)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run schema:fresh

      - name: test v1 definition gate falsifications
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:v1-definition

      - name: v1:definition:check (requirements, evidence, exclusions, and claim drift)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run v1:definition:check

      - name: test accuracy contract gate falsifications
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:accuracy-contract

      - name: accuracy:check (declared grammar and R1–R6 ratchets)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run accuracy:check

      - name: mui oracle corpus freeze gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run mui:oracle:corpus:check

      - name: test mui oracle offline falsifications
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:mui-oracle-offline

      - name: mui oracle offline score (no silent UNSUPPORTED/REFUSED success)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run mui:oracle:offline

      - name: mui oracle live receipt schema (templates ok; agreement needs repro)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run mui:oracle:live:check

      - name: live-figma:evidence:check (V1-EVID-04 live receipt machine twin)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run live-figma:evidence:check

      - name: test:live-figma-evidence (receipt gate refuses forged clean edit)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:live-figma-evidence

      - name: console-loop:all:evidence:check (first-party + MUI + foreign corpora)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run console-loop:all:evidence:check

      # The sync-ledger lockfile (sync/ledger.json): schema, deterministic
      # bytes, seed-vs-receipt agreement, and the OFFLINE drift table over the
      # committed fixture (all five statuses). The live half — `npm run
      # sync:observe` against real Figma files — needs FIGMA_TOKEN and is not
      # a lane; this gate is its committed-fixture twin.
      - name: sync:ledger:check (sync lockfile + offline observe drift table)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run sync:ledger:check

      - name: visual-truth:check (headless scorecard pins + per-lane RATCHET floors)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run visual-truth:check

      - name: test:console-loop-evidence (first-party loop gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:console-loop-evidence

      - name: test:console-loop-mui-evidence (MUI loop gate)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:console-loop-mui-evidence

      - name: human-gates:inventory (pilot/Wave8/publish/second-impl still open)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run human-gates:inventory

      - name: mui 50% denominator freeze (Wave 5 — no shrink)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run mui:denominator:check

      - name: roundtrip:uui:fresh (accuracy evidence regenerates byte-identically)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run roundtrip:uui:fresh

      - name: generation:atomic:check (a late refusal leaves output untouched)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run generation:atomic:check

      - name: figma:proposal:atomic:check (strict and batch refusals write nothing)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run figma:proposal:atomic:check

      - name: provenance:check (stale source cannot silently revert an approved design change)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run provenance:check

      - name: workflow-spine:check (channel-diff + anatomy + merge + preview + adoption + G7 + summarize + spec subset)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run workflow-spine:check

      - name: snapshot:schema:check (malformed and future parity snapshots refuse by path)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run snapshot:schema:check

      - name: static:empty-content:check (geometry-only roots invent no visible text)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run static:empty-content:check

      - name: static:html-security:check (unsafe names and values refuse before output)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run static:html-security:check

      - name: release:package-allowlist:check (RC tarballs reject unexpected files)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run release:package-allowlist:check

      - name: capability:fresh (docs/24 is byte-identical to a rebuild)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run capability:fresh

      - name: ledger:fresh (LEDGER.md + RESIDUALS.md byte-identical to a rebuild)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run ledger:fresh

      - name: publish:check (registry bytes vs all three packed packages)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run publish:check

      - name: verify:catalog (every shard identical to catalog.json)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run verify:catalog

      # Pure functions, no browser, 0.2s — it belongs in the fast lane. It pins
      # the OKLab colour parser against an INDEPENDENT implementation written
      # from the published forward matrices, and pins that unknown colour
      # functions still refuse BY NAME instead of guessing.
      - name: extract:computed:color:check (oklab/oklch vs a second implementation)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run extract:computed:color:check

      # Pure functions over synthetic contracts + a census of the committed
      # corpus, no browser, ~0.3s. It pins the three rules border-style
      # synthesis obeys, each learned from a measured field failure: the
      # keyword rides a WIDTH never a colour (the UUI ButtonGroupBase 80.15),
      # it reads every spelling and holder a width can live in (the longhand
      # blindness that left 14 parts drawing on canvas and painting nothing in
      # CSS), and it never argues with a DECLARED style.
      - name: border-style:check (the keyword rides a width, per side, and never argues)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run border-style:check

      # Pure functions over synthetic contracts + one real committed contract,
      # no browser, ~1s. contracts/contract.schema.json has accepted slot.min,
      # slot.max and acceptsMode:'restrict' since slots existed and NOTHING
      # refereed them — an author who wrote `max: 3` got silence. It also pins,
      # by driving the real engine, that `restrict` has no canvas spelling:
      # Figma's INSTANCE_SWAP preferredValues is a picker hint, so restrict and
      # prefer emit byte-identical canvas output.
      - name: slot-constraints:check (the schema's slot promises are refereed)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run slot-constraints:check

      # Reads committed artifacts only, no browser. docs/12 listed
      # "parent→child prop mapping" as an OPEN gap; it is implemented on both
      # surfaces and was guarded by nothing. mapDepProps resolves the
      # {parentProp} placeholder at COMPILE time, so a grep for it in the
      # emitted script returns nothing and absence cannot be inferred from
      # that. Break the one regex and the canvas silently renders the child's
      # default on every parent variant while every other gate stays green.
      - name: composition-props:check (parent→child prop mapping, both surfaces)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run composition-props:check

      # The real compile path over synthetic contracts + the committed
      # chat-message, no browser, ~0.3s. It pins the ONE July-audit defect
      # class (c6e909e) that was later closed AT THE ENGINE and had no test:
      # CSS's `align-items` initial value is `stretch` and Figma auto-layout's
      # counter default is not, so an `align`-UNSET column drew a full-width
      # bubble in the browser and a 71px one on canvas. 31 of 130 layout
      # holders across 13 contracts leave `align` unset. Ten assertions, and
      # all three ways of getting it wrong are red: reverting the default,
      # stretching an EXPLICIT align, and stretching on a row's wrong axis.
      - name: stretch:check (align unset ≡ align stretch, on canvas and both CSS emitters)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run stretch:check

      # The real engine bundle (in-memory — the zip is never written) against
      # the mocked Figma, over a COMMITTED contract, ~0.5s. It pins the third
      # of the roadmap's "part tree, layout, AND bindings": v5 scored
      # `grep -c boundVariables` = 0, so a designer who DETACHED a variable
      # and typed the same literal back recomputed the IDENTICAL hash with
      # zero diff lines — the file's meaning changed and the differ said
      # "in-sync". Six pins, and the three ways of getting it wrong are red:
      # dropping the bound channel, resolving to the run-scoped VariableID
      # instead of the slash-form NAME (which is what made v5's one binding
      # useless across files), and collapsing every field into one shared
      # channel so the drift reporter's prefix pairing collides.
      - name: canvas:binding:check (the v6 fingerprint carries bindings BY NAME)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run canvas:binding:check

      # THE PHASE 1 EXIT CRITERION, as a test. docs/12-roadmap.md:43 exits
      # Phase 1 when "the differ (not a human with a screenshot) catches a
      # hand-made change to a part's layout inside one variant".
      #
      # canvas:binding:check above pins the SIGNAL — the v6 hash sees part
      # tree, layout and bindings. This pins the TRANSPORT, which was the
      # actual gap: `grep -c getSharedPluginData parity/extract-figma.plugin.js`
      # scored 0, so the stamp was written to the canvas and never read back,
      # and a four-way part-layout edit inside ONE variant projected to a
      # BYTE-IDENTICAL snapshot entry under "✔ Parity clean".
      #
      # It spawns the REAL parity/diff.ts over a committed fixture PAIR
      # (pristine / hand-edited) via PARITY_SNAPSHOT_DIR + PARITY_REPORT —
      # offline, no Figma, nothing in the working tree touched. Four ways of
      # getting it wrong are red: dropping the stamp-vs-recompute comparison
      # (the edited fixture goes green — that green is the defect), firing it
      # on equality (the untouched fixture goes red with 9 findings),
      # reporting a snapshot with NO `variants` as clean instead of NOT
      # EXTRACTED, and calling an older stamp 'canvas-edited'. It also
      # byte-compares the FINGERPRINT_SRC the plugin inlines against
      # core/canvas-fingerprint.ts, so the transport can never start hashing
      # with a private twin of the stamper.
      - name: variant-drift:check (the differ catches a hand edit inside ONE variant)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run variant-drift:check

      - name: exact-projection:check (structured axes refuse ambiguity and ragged matrices)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run exact-projection:check

      - name: exact-proposal:check (strict proposal refuses legacy and semantic ambiguity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run exact-proposal:check
      - name: string-boolean-coercion:check (maintain — a string "true" never becomes a boolean property)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run string-boolean-coercion:check
      - name: token-set-prune:check (maintain — pruning a token set drops nothing a contract still binds)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run token-set-prune:check
      - name: flowbite-bundle-fresh:check (maintain — the committed tailwind bundle is byte-identical to a rebuild)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run flowbite-bundle-fresh:check
      - name: flowbite-dump-propose:check (maintain — the fixture Flowbite dumps still propose the recorded contracts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run flowbite-dump-propose:check
      - name: root-attrs:check (maintain — every anatomy.root.attrs entry is carried on react / react-inline / web-components / html)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run root-attrs:check
      - name: css-vars:check (maintain — generate emits tokens.css defining every custom property the components reference)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run css-vars:check
      - name: code-only-facts:check (maintain — every fact the canvas cannot carry is NAMED in the script, the bundle, plugin data and the plugin report)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run code-only-facts:check
      - name: conformance:roundtrip (canvas half of the conformance kit — contract → canvas → dump → propose, SILENT never waivable)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run conformance:roundtrip
      - name: root-text:check (maintain — a root that IS the text node draws its characters, colour, size and weight; literal ink carried or named)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run root-text:check
      - name: extract:figma:visual:anchors (maintain — visual-parity subjects match the contracts' figma anchors; file-only, no token)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run extract:figma:visual:anchors
      - name: visual-truth:report:fresh (visual-truth REPORT.md re-renders byte-identically from its committed scorecards)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run visual-truth:report:fresh

      # The TOKEN half of `npm run parity`, split out so it can be automated.
      # parity itself is excluded from every lane (it needs a snapshot younger
      # than 14 days and it rewrites parity/report.json); this reads the same
      # extracted snapshot, writes nothing, and PRINTS the age instead of dying
      # on it — 282/282 on name, every mode value and every alias target, in
      # milliseconds. It refuses a snapshot with no `fileKey`/`extractedAt`,
      # which is what stops it degrading into tokens/ vs tokens/.
      - name: tokens:snapshot:check (tokens/ vs the extracted Figma variable table)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run tokens:snapshot:check

      # Recorded HTTP bodies through an injected fetch, no credential, no
      # network. It pins that the 403 measured on 2026-08-04 — a token missing
      # `file_variables:read`, which the user can fix in a minute — is reported
      # as such and not folded into the same silent degradation as every other
      # refusal, and that the split is narrow enough to refuse a decoy body.
      - name: figma:rest:refusal:check (the scope 403 is not the plan 403)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run figma:rest:refusal:check

      # Not one of the 33 named gates, but CONTRIBUTING.md § "The gates" tells
      # contributors to run it and it costs under a second with no extra build.
      - name: test packages/cli (all node:test files)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/cli run test

      - name: coverage packages/cli source
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/cli run coverage

      - name: upload CLI coverage JSON
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-source-coverage
          path: coverage/cli/coverage-final.json
          if-no-files-found: warn
