# FAST LANE — the signal a contributor gets in under a minute.
#
# WHY THIS FILE EXISTS. Until 2026-08-04 this repository had no .github/
# directory at all: 33 gate scripts, every one of them fired only when a human
# typed it. That is the same shape as the two incidents the gates themselves
# were written for — `deploy-check.mjs` (the live playground served a plugin
# build from mid-July for three weeks while every BUILD-time guard was green)
# and `publish-check.mjs` (a 332-line `onboard` rewrite landed under a version
# the registry already served). In both, the machinery was fresh and nothing
# COMPARED it to what the world could see. A pull request from an outside
# contributor was in exactly that position: zero automated verification.
#
# WHAT THIS LANE IS FOR. Everything here is cheap enough that a contributor can
# also run it locally before pushing — `npm run ci:lane fast` executes the
# guarded commands directly from this file (see docs/25-reading-a-red-ci.md).
# It prints, but deliberately does not run, prep commands such as npm ci and
# clean-checkout builds. Run the printed package builds first on a cold tree.
#
# In addition to the established contract gates, this lane closes package and
# application surfaces that were previously invisible: every tracked CLI and
# Worker test, measured CLI-source coverage, schema/emitter build + pack smoke,
# Worker/package/app typechecks, and scoped lint/format checks.
#
# WHY publish:check IS IN THE FAST LANE AND SAFE HERE. It reads the public npm
# registry and never writes: `npm view` + an HTTPS fetch of each published
# tarball, then a byte comparison of every locally packed file. Publishing
# needs the owner's OTP and stays a human act. Each package's "not published
# yet" branch is a PASS while the other package versions are still checked:
#
#     ✔ SOURCE AHEAD — @ds-contracts/cli@0.5.0-rc.1 is not published;
#       registry byte comparison skipped.
#     ✔ SOURCE AHEAD — @ds-contracts/schema@16.1.0-rc.1 is not published;
#       registry byte comparison skipped.
#     REFUSED: @ds-contracts/emitter-web-components@0.3.0 registry contents
#       differ (...). The unpublished RCs did not hide the published claim.
#
# THE PREREQUISITE THAT IS EASY TO MISS: every package's `dist/` is gitignored
# (.gitignore:3 `dist/`), so a fresh checkout has nothing honest to pack and
# compare. Hence the three guarded prep builds below; if one is removed,
# publish:check refuses that package by name instead of blessing partial bytes.
#
# HOW A FAILURE REPORTS. Each gate is its own step guarded by
# `if: !cancelled() && steps.setup.outcome == 'success'`, so ONE red gate never
# hides the others — every gate still runs and reports its own conclusion, and
# the job fails at the end. `continue-on-error` is deliberately NOT used: it
# would paint a failing gate green in the checks list.
name: fast

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  # Never cancel a main-branch run — main's result is the record of what the
  # default branch is worth. Feature branches supersede themselves freely.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast:
    name: fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: eval:record:check proves evals/results.json was
        # measured on an ANCESTOR of the commit under test (git merge-base
        # --is-ancestor). A depth-1 checkout of a PR merge commit has no
        # ancestors at all, so the stamped record read as foreign
        # (2026-08-22, run 32600919494). .git is ~280 MB; the cost is seconds.
        with:
          fetch-depth: 0

      # Node is pinned to the exact version the gates were verified on, not to
      # `20.x`: docs and packages/cli both declare `engines.node >= 20`, and
      # 20.19.4 is what produced every measurement in this file.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci

      # THE ONLY HARD STOP. Without the install nothing below can be attempted,
      # so `setup` sits directly after it: a failed `npm ci` skips `setup`, every
      # guarded step below evaluates false, and the job stops honestly.
      - name: install complete
        id: setup
        run: echo "Every step below runs even if an earlier one fails; the job fails at the end."

      # BROWSER. `css-vars:check` drives a real Chromium through
      # chromiumExecutable() (extract/figma/visual-parity/render.ts). It used to
      # resolve the runner's preinstalled system Chrome by silent fallback — a
      # DIFFERENT browser from the one the full lane and every committed capture
      # use, which is the whole defect fix/pin-render-browser exists to remove.
      # The resolver now refuses rather than substitute, so this lane installs
      # the revision playwright-core pins, exactly as full.yml does.
      # Cache first, install second: the install is a no-op on a cache hit, and
      # `restore-keys` can restore a cache that predates a lockfile bump and
      # therefore lacks the pinned revision — the install repairs that instead of
      # the resolver quietly using whatever else the cache happens to hold.
      - name: cache playwright browsers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-ms-playwright-
      - name: install chromium (playwright-core ships no browser)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env: { CI_LANE_STEP: prep }
        run: npx playwright-core install --with-deps chromium

      # Root consumers import @ds-contracts/schema through its package exports,
      # which point at gitignored dist/. A clean checkout therefore must build
      # the workspace before any root typecheck/test can resolve it. The local
      # lane runner prints (but does not execute) this prep command.
      - name: build @ds-contracts/schema (resolution + publish:check prerequisite)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env: { CI_LANE_STEP: prep }
        run: npm --prefix packages/schema run build
      - name: build @ds-contracts/core (the published engine surface; depends on the schema dist)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env: { CI_LANE_STEP: prep }
        run: npm --prefix packages/core run build

      # publish:check packs all three BUILT packages and compares every file
      # against the registry; dist/ is gitignored, so each must be built here.
      # Guarded like gates so a broken build does not hide unrelated results.
      # CI_LANE_STEP: prep keeps `npm run ci:lane fast` from running it locally.
      - name: build @ds-contracts/cli (publish:check prerequisite)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env: { CI_LANE_STEP: prep }
        run: npm --prefix packages/cli run build

      - name: build @ds-contracts/emitter-web-components (publish:check prerequisite)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env: { CI_LANE_STEP: prep }
        run: npm --prefix packages/emitter-web-components run build

      # ---------------------------------------------------------------- gates
      - name: falsify lane setup cardinality
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx tsx .github/scripts/lane-coverage.ts --self-test

      # A GATE ON THE GATES. Refuses when a gate-shaped script in package.json
      # is in no lane and on no exclusion list, when a lane names a script that
      # does not exist, or when a gate step loses its independent-reporting
      # guard. Without it, the way this repo's CI defect returns is: gate #34
      # is written, never wired, and the checks list stays green.
      - name: ci:lanes (every gate script is wired into a lane or excluded by name)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run ci:lanes

      - name: typecheck (src, scripts, core, extract, parity, evals, conformance)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck

      - name: typecheck packages/cli
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/cli run typecheck

      # The root tsconfig's `include` does not name .github, so this directory's
      # TypeScript would otherwise be checked for the first time by CI itself.
      - name: typecheck .github/scripts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npx tsc --noEmit -p .github/scripts/tsconfig.json

      - name: lint hand-maintained source
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lint

      - name: prettier check (hand-maintained source only)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run format:check

      - name: typecheck @ds-contracts/schema
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/schema run typecheck
      - name: "@ds-contracts/core: typecheck"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/core run typecheck

      - name: package smoke @ds-contracts/schema
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/schema run package:smoke

      - name: typecheck @ds-contracts/emitter-web-components
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/emitter-web-components run typecheck

      - name: package smoke @ds-contracts/emitter-web-components
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/emitter-web-components run package:smoke

      - name: typecheck playground
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck:playground

      - name: typecheck dashboard
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck:dashboard

      - name: typecheck site
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck:site

      - name: test Worker
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix workers/assist run test

      - name: typecheck Worker
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix workers/assist run typecheck

      - name: test playground bridge capability
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:playground

      # The recipe/IR pivot's Phase 0 surface (docs/32-recipe-ir-pivot.md): the
      # primitive Figma IR, canonical envelope, normalization, and hashing.
      # Named here on the day it is added rather than later — an experimental
      # path is still a surface, and this repo's recurring lesson is that
      # UNGATED SURFACES ROT. The two properties under test are the ones the
      # pivot dies without: the IR vocabulary is CLOSED (no CSS passthrough
      # survives a node schema) and the envelope's account of every input fact
      # is TOTAL in both directions (no silent loss, no fabricated disclosure).
      - name: test experimental recipe path (docs/32)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:recipe
      - name: recipe:normalize:check (canonical JSON is idempotent and key-order-insensitive)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:normalize:check
      - name: recipe:hash:check (domain-separated SHA-256 is stable and mutation-sensitive)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:hash:check
      - name: recipe:button:check (button@1 compiles and collapses as a two-cycle fixed point)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:button:check
      - name: recipe:input-field:check (input-field@1 is offline-only, total, semantic, and adversarially falsified)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:check
      - name: recipe:input-field:browser:check (controlled/uncontrolled and stable-shadow lifecycle plus visual regions)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:browser:check
      - name: recipe:combobox:check (two-source detached-listbox IR, fixed point, accounting, and behavior)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:combobox:check
      - name: recipe:scene-readback:check (planned facts are compared only with actual scene properties)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:scene-readback:check
      - name: recipe:pivot-status:check (Button/Input false, v7 attempt 1 closed, v8 draft pending authorization)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:pivot-status:check
      - name: recipe:input-field:live:v3:authorization:self-test (chronology and no-posthoc guard)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v3:authorization:self-test
      - name: recipe:input-field:live:v3:authorization:check (committed antecedent and clean descendant)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v3:authorization:check -- --capture-code-commit HEAD
      - name: recipe:input-field:live:v3:offline:check (deterministic plan, scene proof, hard-gate falsifications)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v3:offline:check
      - name: recipe:input-field:live:v4:self-test (authorization, preflight, normalization, journaling, and order)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v4:self-test
      - name: recipe:input-field:live:v5:check (generated writer, exact transport, authorization gates, offline smoke)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v5:check
      - name: recipe:input-field:live:v7:check (phase-stable signed broker, hermetic lifecycle, two roots, crash cleanup)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v7:check
      - name: recipe:input-field:live:v8:check (per-side stroke weights, named transport facts, phase-stable antecedent)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v8:check
      - name: recipe:input-field:live:v9:check (carried scene-readback for VARIABLE_ALIAS and bound-variable fills)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v9:check
      - name: recipe:input-field:live:v10:check (carried v3 verifier uses scene-readback-v10, not hashed scene-readback.ts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v10:check
      - name: recipe:input-field:live:v11:check (first-segment role recovery when font-provenance= is present)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v11:check
      - name: recipe:input-field:live:v12:check (post-settle content fill restore after hashed v11 writer)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v12:check
      - name: recipe:input-field:live:v13:check (signed post-writer content fill restore before extract)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v13:check
      - name: recipe:input-field:live:v14:check (two-pass parent then content fill restore; v13 restore frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v14:check
      - name: recipe:input-field:live:v15:check (measure FILL while visible; v14 restore frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v15:check
      - name: recipe:input-field:live:v16:check (extract measures hidden content FILL while visible; v15 restore frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v16:check
      - name: recipe:input-field:live:v17:check (surface leading-slot solid paint from payload or child; v16 extract frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v17:check
      - name: recipe:input-field:live:v18:check (surface leading-slot fills.0.color from child; hashed v17 scene-readback frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v18:check
      - name: recipe:input-field:live:v19:check (surface strokes.0.weight from uniform per-side FLOAT; hashed v18 scene-readback frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v19:check
      - name: recipe:input-field:live:v20:check (surface variant layout.width.value from existing width FLOAT; hashed v19 scene-readback frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v20:check
      - name: recipe:input-field:live:v21:check (surface layout.height.value from existing height FLOAT; hashed v20 scene-readback frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v21:check
      - name: recipe:input-field:live:v22:check (alias layout width/height without duplicate source field; hashed v21 scene-readback frozen)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run recipe:input-field:live:v22:check
      - name: recipe:input-field:live:v23:check (place aliased layout.width.value at compile index; hashed v22 scene-readback frozen)
