        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run canvas:binding:check

      # THE PHASE 1 EXIT CRITERION, as a test. docs/12-roadmap.md:43 exits
      # Phase 1 when "the differ (not a human with a screenshot) catches a
      # hand-made change to a part's layout inside one variant".
      #
      # canvas:binding:check above pins the SIGNAL — the v6 hash sees part
      # tree, layout and bindings. This pins the TRANSPORT, which was the
      # actual gap: `grep -c getSharedPluginData parity/extract-figma.plugin.js`
      # scored 0, so the stamp was written to the canvas and never read back,
      # and a four-way part-layout edit inside ONE variant projected to a
      # BYTE-IDENTICAL snapshot entry under "✔ Parity clean".
      #
      # It spawns the REAL parity/diff.ts over a committed fixture PAIR
      # (pristine / hand-edited) via PARITY_SNAPSHOT_DIR + PARITY_REPORT —
      # offline, no Figma, nothing in the working tree touched. Four ways of
      # getting it wrong are red: dropping the stamp-vs-recompute comparison
      # (the edited fixture goes green — that green is the defect), firing it
      # on equality (the untouched fixture goes red with 9 findings),
      # reporting a snapshot with NO `variants` as clean instead of NOT
      # EXTRACTED, and calling an older stamp 'canvas-edited'. It also
      # byte-compares the FINGERPRINT_SRC the plugin inlines against
      # core/canvas-fingerprint.ts, so the transport can never start hashing
      # with a private twin of the stamper.
      - name: variant-drift:check (the differ catches a hand edit inside ONE variant)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run variant-drift:check

      - name: exact-projection:check (structured axes refuse ambiguity and ragged matrices)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run exact-projection:check

      - name: exact-proposal:check (strict proposal refuses legacy and semantic ambiguity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run exact-proposal:check
      # THE CHANNEL TABLE (docs/30). Every CSS computed property the capture
      # can observe is classified exactly once (spec/channel-table.json); this
      # refuses on an unclassified observed property, a ghost CARRIED anchor,
      # a missing schema/conformance row, or drifted totals — then proves it
      # can go red at all.
      #
      # Since 2026-08-26 it also holds EVIDENCE: every CARRIED row must declare
      # whether it is `measured` (a named conformance case observes it end to
      # end), `code-cited` (an engine citation and nothing more — a declared
      # gap) or `unobservable` (no contract can spell the channel, so no case
      # could ever catch it). The state is re-derived from both conformance
      # manifests rather than trusted, so a row can neither over-claim nor
      # under-claim, and cites are checked in BOTH directions — a row citing a
      # deleted case, or one that measures some other channel, now goes red.
      # `npm run channel-table:rederive` is the remedy command.
      - name: channel-table:check (no unclassified channel; every CARRIED anchor exists; CARRIED evidence declared and re-derived)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run channel-table:check
      - name: channel-table self-test (a dropped row, a ghost anchor, a stray byte, a missing evidence state, a "measured" over-claim and a ghost case cite each go red)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run channel-table:self-test
      - name: string-boolean-coercion:check (maintain — a string "true" never becomes a boolean property)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run string-boolean-coercion:check
      - name: token-set-prune:check (maintain — pruning a token set drops nothing a contract still binds)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run token-set-prune:check
      - name: flowbite-bundle-fresh:check (maintain — the committed tailwind bundle is byte-identical to a rebuild)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run flowbite-bundle-fresh:check
      - name: flowbite-dump-propose:check (maintain — the fixture Flowbite dumps still propose the recorded contracts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run flowbite-dump-propose:check
      - name: host-placement:check (maintain — a minted host section never collides with a sibling, a designer's hand-moved section survives an amend, and placement is a fixed point across two runs)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run host-placement:check
      - name: root-attrs:check (maintain — every anatomy.root.attrs entry is carried on react / react-inline / web-components / html)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run root-attrs:check
      - name: css-vars:check (maintain — generate emits tokens.css defining every custom property the components reference)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run css-vars:check
      - name: code-only-facts:check (maintain — every fact the canvas cannot carry is NAMED in the script, the bundle, plugin data and the plugin report)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run code-only-facts:check
      - name: conformance:roundtrip (canvas half of the conformance kit — contract → canvas → dump → propose, SILENT never waivable)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run conformance:roundtrip
      - name: root-text:check (maintain — a root that IS the text node draws its characters, colour, size and weight; literal ink carried or named)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run root-text:check
      - name: "placeholder-ink:check (maintain — an EMPTY form control reads as empty: the ::placeholder ink is carried to the canvas, the missing STRING is named, and no stylesheet surface ships an invalid `placeholder-color:` declaration)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run placeholder-ink:check
      - name: first-party-bundle:check (maintain — the 56 first-party contracts ride `figma bundle` with the layered token set; refusals arrive as one named list)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run first-party-bundle:check
      - name: code-connect:check (maintain — every anchored contract emits one Code Connect file mapping every enum value by display name, every boolean/text prop and every slot; anchorless contracts refuse by name; byte-deterministic; TS-parsed)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run code-connect:check
      - name: prop-collision:check (maintain — a prop named like a DOM attribute / HTMLElement member is Omit<>-ed on react and accessor-less on web-components, named in the header; the collision table matches the installed @types/react + lib.dom; generate refuses per contract)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run prop-collision:check
      - name: playground:flow-check (maintain — every number the Playground's two guided tours print is re-derived headless from the same engine calls over the same committed inputs; quoted refusals exist verbatim in source; the ToggleSwitch roleException refusal is pinned)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run playground:flow-check
      - name: extract:figma:visual:anchors (maintain — visual-parity subjects match the contracts' figma anchors; file-only, no token)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run extract:figma:visual:anchors
      - name: visual-truth:report:fresh (visual-truth REPORT.md re-renders byte-identically from its committed scorecards)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run visual-truth:report:fresh

      # The TOKEN half of `npm run parity`, split out so it can be automated.
      # parity itself is excluded from every lane (it needs a snapshot younger
      # than 14 days and it rewrites parity/report.json); this reads the same
      # extracted snapshot, writes nothing, and PRINTS the age instead of dying
      # on it — 282/282 on name, every mode value and every alias target, in
      # milliseconds. It refuses a snapshot with no `fileKey`/`extractedAt`,
      # which is what stops it degrading into tokens/ vs tokens/.
      - name: tokens:snapshot:check (tokens/ vs the extracted Figma variable table)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run tokens:snapshot:check

      # Recorded HTTP bodies through an injected fetch, no credential, no
      # network. It pins that the 403 measured on 2026-08-04 — a token missing
      # `file_variables:read`, which the user can fix in a minute — is reported
      # as such and not folded into the same silent degradation as every other
      # refusal, and that the split is narrow enough to refuse a decoy body.
      - name: figma:rest:refusal:check (the scope 403 is not the plan 403)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run figma:rest:refusal:check

      # CANVAS CENSUS (docs/23 §C.1.1 vocabulary; the owner's v1 bar, 2026-08-23):
      # the denominator is EVERY committed contract with a Figma script — the
      # manifest is regenerated and compared (a contract outside it refuses by
      # name) and every row's code render must exist. The canvas half landed
      # (census/canvas-full): every row carries canvas-<slug>.png beside its
      # code render, and the REFERENCE half (the permanent rule: a visual
      # reference is ONLY the real library's render) puts ref-<slug>.png —
      # the real library's own render — or a named UNMAPPABLE row beside
      # every pair; verdicts are voided to "ungraded" pending the
      # adversarial re-grade. The lane holds `--phase full`.
      # The blind adversarial re-grade (2026-08-24) left NOT-recognisable
      # verdicts as NAMED reds: without the flag the gate exits non-zero on
      # them. --allow-red-verdicts carries them, named, in THIS branch's lane
      # only while the burn-down proceeds.
      # TODO(census burn-down): fix the rows in the receipt's
      # "Blind re-grade 2026-08-24" burn-down list to 0 and DROP this flag.
      - name: census:check --phase full (code render + canvas shot + real-library ref + verdict for every committed contract)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run census:check -- --phase full --allow-red-verdicts
      - name: census self-test (the gate goes red on a deleted render, a contract outside the manifest, a pending canvas half, and a deleted real-library ref)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run census:check -- --self-test
      # THE THIRD COLUMN. The census measures recognisability and round-trip;
      # both can be green on a set a designer cannot work with, so `usable` is
      # a third, independent claim: reflow, variant switching, token binding,
      # no faked layout. Five failures reproduce on the eight altitude sets
      # measured today; they are FROZEN BY NAME in
      # parity/receipts/v1/usable-baseline.json so the gate can run here, where
      # a NEW failure — or a pinned one that changes shape — goes red, and a
      # pinned one that stops reproducing refuses until it is re-recorded. An
      # excluded gate rots; a baselined gate burns down.
      - name: canvas:usable:check (reflow, variant switching, token binding, no faked layout — held against the committed baseline)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run canvas:usable:check
      - name: canvas:usable self-test (frozen children, a dead axis value, nothing bound, an in-flow child positioned ABSOLUTE, and a healed pin all go red by name)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run canvas:usable:self-test
      # The reverse direction on the two designer kits: committed REST
      # fixtures → propose → generate React+WC, twice, in memory. Holds
      # SILENT = 0 (every canvas fact carried or named), byte-idempotence,
      # the committed rows/hashes, the render pairs and the verdicts.
      - name: census:check --phase design-to-code (canvas → contract → code; 0 silent, byte-deterministic)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run census:check -- --phase design-to-code

      # FIRST-PASS EXAM (docs/31 — the owner's criticism, 2026-08-24: "I don't
      # think I've seen one successful pass on the first try"). Every other
      # gate in this file measures END-STATE quality, after a heal loop. This
      # one holds the committed evidence of the OTHER metric: the documented
      # chain run end to end with zero intervention and NO RETRY. The gate is a
      # pure reader — it never runs an exam (an exam needs a library sandbox, a
      # Figma token and a browser); it holds the packets, the MANIFEST
      # denominator, the artifact hashes, the ratchet and the byte-stable
      # receipt against each other.
      - name: first-pass:check (every exam's packets, ratchet and receipt agree)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run first-pass:check
      - name: first-pass self-test (the gate goes red on a dropped packet, a smuggled packet, a corrupted image, a ratchet raised above the truth, and an edited receipt)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run first-pass:check -- --self-test
      # THE DOOR REGISTER (spec/DOOR-REGISTER.md). A door is any rule that
      # decides a computed fact is NOT a fact of this component, or that a fact
      # IS admitted — the pipeline's only judgement calls. The gate holds the
      # register to the code in four directions (an @door marker with no entry,
      # an entry with no marker, an entry whose line is not where the marker
      # sits, and a door CLAIMING a receipt whose receipt path does not exist)
      # and re-measures the subtraction census by re-fusing all 116 committed
      # captures offline, refusing when the pinned per-library numbers move.
      - name: render-browser:check (the render browser is the PINNED revision, and a receipt names what rendered it)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run render-browser:check
      - name: mixed-browser:check (no capture staples two browsers into one evidence file — docs/23 D.37)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run mixed-browser:check
      - name: door-register:check (every subtractive heuristic named, premised, and its receipt path proved)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run door-register:check
      - name: door-register self-test (the gate goes red on an unregistered door, an unmarked entry, and a claimed receipt with no path)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run door-register:self-test

      # THE LOWERING REGISTER — spec/LOWERING.md + spec/lowering.json. A DOOR
      # decides whether a fact is admitted; a LOWERING decides what SHAPE a
      # carried fact takes on the other surface. `core/emit-figma-script.ts` is
      # 8,230 lines, carries ZERO `@door` markers, and the door register has no
      # `emit` stage at all — so every FORWARD structure decision (the margin
      # box, auto-layout inference, the slot birth box, the state plane, set
      # placement) was unregistered and ungated, which is why a forward failure
      # could never be cited to a line. This gate adds that stage. It refuses a
      # `@lower` marker with no entry, an entry whose cited line moved, a rule
      # with no canonical form, and an implemented rule whose inverse does not
      # return that canonical form. It also VERIFIES `markerOutsideRule` rather
      # than trusting it: spec/door-register.json stamps that claim on all 27
      # `propose.*` layout doors, where it is false.
      - name: lowering:check (every layout lowering named, contexted, given a canonical form, and held to its inverse)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lowering:check
      - name: lowering self-test (planted reds - an unregistered marker, a moved rule line, a missing canonical, an inverse that does not return it, a false markerOutsideRule)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lowering:check -- --self-test

      # THE GRAMMAR COVERAGE SPEC — spec/GRAMMAR-COVERAGE.md + grammar-coverage.json.
      # The CAPTURE CONFIG GRAMMAR is the language a user mounts their library
      # in, and three holes in it were found by AUTHORING three held-out exam
      # subjects rather than by running anything: a compound export name was a
      # syntax error, two class-token axes SILENTLY dropped one of the two, and
      # a Date could not be spelled at all. A first-pass failure caused by a
      # known grammar gap measures the grammar rather than the engine, so the
      # remaining gaps are named here with the library that proves each one.
      # The supported half is measured from the CONFIGS ON DISK, never from the
      # TypeScript type that declares the surface — a coverage number computed
      # from its own denominator is the self-attestation this tree keeps
      # re-learning. Refuses when a config uses a construct the spec omits, and
      # when a spec row claims support that nothing exercises.
      - name: grammar-coverage:check (every config construct claimed; every supported claim exercised)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run grammar-coverage:check
      - name: grammar-coverage self-test (ten planted reds - a dropped construct, an exerciser that does not exercise, a ghost file, an unimplemented marker, stale totals, an empty corpus)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run grammar-coverage:check -- --self-test
      # CORPUS REPRODUCIBILITY — the twin of the gate above, and the reason the
      # first-pass exam went 0/8 the day it first ran: the committed contracts
      # claim to be the output of the documented chain, and nothing checked it.
      # The PROMOTE half runs here — pure, no browser, ~2s: every library's
      # committed capture record plus its authored facts must re-promote to the
      # committed contracts byte for byte. The CAPTURE half needs Chromium and
      # the git-ignored sandboxes, so it runs OUT OF BAND
      # (`-- --capture`) and RECORDS what it measured; this step judges that
      # committed measurement against the committed ledger, which is why its
      # verdict is the same on every machine.
      - name: corpus:reproducible:check (the documented chain re-derives its own corpus; every divergence named)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run corpus:reproducible:check
      - name: corpus:reproducible self-test (the gate goes red on an unnamed divergence, a stale ledger row, and an unnamed capture divergence)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run corpus:reproducible:check -- --self-test

      # Not one of the 33 named gates, but CONTRIBUTING.md § "The gates" tells
      # contributors to run it and it costs under a second with no extra build.
      - name: test packages/cli (all node:test files)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/cli run test

      - name: coverage packages/cli source
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm --prefix packages/cli run coverage

      - name: upload CLI coverage JSON
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-source-coverage
          path: coverage/cli/coverage-final.json
          if-no-files-found: warn
