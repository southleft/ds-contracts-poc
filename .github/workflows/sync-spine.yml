# SYNC SPINE — the scheduled drift run (SYNC LAYER STEP 2).
#
# Every two hours (and on demand) this lane runs the headless drift spine
# (sync/spine.ts): observe the Figma canvas against sync/ledger.json, PULL
# every canvas-ahead set into a reviewable proposal bundle (proposed contract
# + diff + per-property classification), and surface every code-ahead record
# as a "canvas is behind: publish+apply needed" row. Report-only by default —
# the run uploads its sync/out/<runId>/ bundle as an artifact and writes the
# drift table + decisions to the job summary.
#
# RED MEANS AN UNDECIDED ROW (policy, 2026-08-23). A red run means "a row
# needs a human decision that is not yet recorded". Every other outcome is
# green:
#   spine 0, Verdict: clean          → green, notice ("every record in-sync");
#   spine 0, Verdict: drift-decided  → green WITH a ::warning — drift exists,
#                                      but every drifted row carries a FRESH
#                                      decision in sync/ledger.json (adopt /
#                                      pending-reapply / pending-restamp /
#                                      pending-reconcile); the drift table is
#                                      in the summary, the bundles in the
#                                      artifact, the pending Figma writes in
#                                      sync/PENDING.md; output drift=true;
#   spine 1, Verdict: undecided      → RED — a drifted row has no recorded
#                                      decision (or its decision is stale: the
#                                      contract hash / stamp / dump moved since
#                                      it was taken), or an untracked set. The
#                                      summary names the rows and the two verbs
#                                      that record a decision;
#   spine 2                          → RED with a DISTINCT summary — the spine
#                                      itself could not run (usage/config
#                                      error, API refusal, crash). Not drift.
# Why: the first six live runs (2026-08-22/23) were red for one cause — the
# repo's own instrument and ledger had moved — and a lane that stays red for
# every 2-hour run while a decided write waits on a human conflates "the
# canvas moved" with "nobody has looked". The previous rule ("a red run IS the
# drift signal", 2026-08-08) is retired; the signal is the ::warning + summary
# + artifact, and the red is reserved for the question nobody has answered.
#
# SECRET REQUIRED, DEGRADES BY NAME. The spine needs the repository secret
# FIGMA_TOKEN (a Figma personal access token with file read scope; the owner
# configures it under Settings → Secrets → Actions). When the secret is
# absent the run SKIPS with a named notice and exits green — a missing
# credential must never masquerade as canvas drift (no red herrings in CI).
#
# OPT-IN PR CREATION. Set the repository VARIABLE SYNC_SPINE_OPEN_PR=true to
# let the spine open pull requests for canvas-ahead drift (capped at 1 per
# run; the sync/out/state.json cursor + the fingerprint marker in each PR
# body prevent duplicate PRs for the same drift). Default: plan/report only.
#
# NOT A PR GATE. This lane is scheduled, needs a secret and the live Figma
# API, and its red means "the canvas moved", not "this commit is wrong" — so
# `sync:spine` is EXCLUDED by name in .github/scripts/lane-coverage.ts and the
# spine is invoked via tsx here. The committed twin that DOES gate every PR
# is the fixture-mode eval `sync-spine-drift` (npm run eval -- --only
# sync-spine) plus sync:ledger:check in the fast lane.
name: sync-spine

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-spine
  cancel-in-progress: false

jobs:
  spine:
    name: drift spine (report-only unless SYNC_SPINE_OPEN_PR=true)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci

      - name: sync spine (observe + pull)
        id: spine
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPEN_PR: ${{ vars.SYNC_SPINE_OPEN_PR }}
        run: |
          if [ -z "$FIGMA_TOKEN" ]; then
            echo "::notice title=sync-spine skipped::FIGMA_TOKEN secret is not configured — the drift spine needs a Figma personal access token (repository Settings → Secrets → Actions → FIGMA_TOKEN). Skipping by name; this is NOT a drift result."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p sync/out
          # The spine's exit code is the verdict (see the header): 0 = clean or
          # drift-decided, 1 = an undecided row, 2 = the spine could not run.
          set +e
          if [ "$OPEN_PR" = "true" ]; then
            echo "SYNC_SPINE_OPEN_PR=true — the spine may open at most 1 PR this run (cursor-deduplicated)."
            npx tsx sync/spine.ts --run-id "gh-${GITHUB_RUN_ID}" --open-pr --max-prs 1
          else
            npx tsx sync/spine.ts --run-id "gh-${GITHUB_RUN_ID}"
          fi
          rc=$?
          set -e
          echo "spine-exit=$rc" >> "$GITHUB_OUTPUT"
          report="sync/out/gh-${GITHUB_RUN_ID}/SPINE.md"
          verdict=$(grep -m1 '^Verdict:' "$report" 2>/dev/null | sed 's/^Verdict: *//; s/ .*//')
          totals=$(grep -m1 '^Totals:' "$report" 2>/dev/null || echo 'Totals: (see summary)')
          decisions=$(grep -m1 '^Decisions:' "$report" 2>/dev/null || echo 'Decisions: (see summary)')
          echo "verdict=${verdict:-crashed}" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0)
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              if [ "$verdict" = "clean" ]; then
                echo "::notice title=sync-spine clean::every ledger record is in-sync with the canvas."
                echo "drift=false" >> "$GITHUB_OUTPUT"
              else
                echo "::warning title=sync-spine drift (decided)::${totals} ${decisions} Every drifted row carries a recorded decision — the pending Figma writes are listed in sync/PENDING.md (also in the sync-spine-${GITHUB_RUN_ID} artifact with the proposal bundles). Green by policy: red is reserved for an UNDECIDED row."
                echo "drift=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            1)
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=sync-spine UNDECIDED drift::${totals} ${decisions} A row needs a human decision that is not yet recorded (or its decision is stale). Record one: npm run sync:observe -- --adopt <id> --note \"…\"  OR  --decide <id> --kind pending-reapply|pending-restamp|pending-reconcile --note \"…\" --command \"…\". The rows are named under '### UNDECIDED' in the job summary."
              echo "drift=true" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              {
                echo "# sync-spine could not run (exit $rc)"
                echo
                echo "This is NOT a drift result. The spine itself failed — usage/config error, Figma API refusal, or a crash. Read the step log; no SPINE.md was produced$( [ -f "$report" ] && echo ' (a partial report follows)' )."
                [ -f "$report" ] && { echo; cat "$report"; }
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=sync-spine FAILED (exit $rc)::the spine could not run — usage/config error, API refusal, or a crash. This red is distinct from drift; read the step log."
              exit "$rc"
              ;;
          esac

      - name: upload drift report
        if: ${{ !cancelled() && steps.spine.outputs.skipped != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-spine-${{ github.run_id }}
          path: sync/out/
          if-no-files-found: warn
          retention-days: 14
